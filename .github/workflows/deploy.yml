name: Publicar tienda en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar los archivos de la tienda
        run: |
          mkdir -p dist
          for item in *.html css js data imagenes admin; do
            if [ -e "$item" ]; then cp -r "$item" dist/; fi
          done

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nova-shop-guatemala --commit-dirty=true
