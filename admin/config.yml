backend:
  name: github
  repo: gilbertosalazarbarrera-coder/nova-shop-guatemala
  branch: main
  site_domain: sensational-pony-a2154a.netlify.app

locale: es
publish_mode: simple
media_folder: "imagenes/productos"
public_folder: "imagenes/productos"

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    folder: "data/productos"
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{name}} — Q{{price}}"
    fields:
      - { label: "Nombre", name: name, widget: string }
      - { label: "Marca", name: brand, widget: string, required: false }
      - { label: "Categoría", name: category, widget: string }
      - { label: "Precio (Q)", name: price, widget: number, value_type: float, min: 0 }
      - { label: "Precio anterior (Q)", name: originalPrice, widget: number, value_type: float, min: 0, required: false }
      - { label: "Descripción", name: description, widget: text }
      - { label: "Imagen", name: image, widget: image }
      - { label: "Insignia (ej. Oferta, Nuevo)", name: badge, widget: string, required: false }
      - { label: "Destacado", name: featured, widget: boolean, default: false }
      - { label: "Disponible", name: inStock, widget: boolean, default: true }
